<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cover4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08240f"/>
      <stop offset="100%" stop-color="#136b3f"/>
    </linearGradient>
    <radialGradient id="glow4" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#4fd982" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4fd982" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#cover4)"/>
  <rect width="1280" height="640" fill="url(#glow4)"/>

  <!-- cluster dots motif -->
  <g fill="#ffffff" fill-opacity="0.4">
    <circle cx="900" cy="150" r="7"/>
    <circle cx="930" cy="180" r="7"/>
    <circle cx="895" cy="195" r="7"/>
    <circle cx="1080" cy="260" r="7"/>
    <circle cx="1110" cy="285" r="7"/>
    <circle cx="1095" cy="310" r="7"/>
    <circle cx="1150" cy="255" r="7"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="900" y1="150" x2="930" y2="180"/>
    <line x1="930" y1="180" x2="895" y2="195"/>
    <line x1="1080" y1="260" x2="1110" y2="285"/>
    <line x1="1110" y1="285" x2="1095" y2="310"/>
    <line x1="1110" y1="285" x2="1150" y2="255"/>
  </g>

  <!-- badge icon top-left: cluster -->
  <rect x="60" y="56" width="52" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="80" cy="78" r="5" fill="#ffffff"/>
  <circle cx="95" cy="72" r="5" fill="#ffffff"/>
  <circle cx="90" cy="94" r="5" fill="#ffffff"/>
  <line x1="80" y1="78" x2="95" y2="72" stroke="#ffffff" stroke-width="1.8"/>
  <line x1="80" y1="78" x2="90" y2="94" stroke="#ffffff" stroke-width="1.8"/>

  <!-- title -->
  <text x="58" y="300" font-family="Poppins, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">GENE EXPRESSION</text>
  <text x="58" y="365" font-family="Poppins, sans-serif" font-size="52" font-weight="700" fill="#6fe5a0" letter-spacing="1">CLUSTERING</text>

  <!-- caption -->
  <text x="60" y="560" font-family="Raleway, sans-serif" font-size="18" fill="#c9ecd6">Challenge · Cell Viability Dataset</text>
  <line x1="60" y1="578" x2="1220" y2="578" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
</svg>
