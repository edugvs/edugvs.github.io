<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cover5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e0a0a"/>
      <stop offset="100%" stop-color="#7a2020"/>
    </linearGradient>
    <radialGradient id="glow5" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#f0684d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0684d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#cover5)"/>
  <rect width="1280" height="640" fill="url(#glow5)"/>

  <!-- seismic waveform -->
  <polyline points="850,260 890,260 905,200 925,320 945,150 965,300 985,260 1230,260"
    fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- badge icon top-left: pulse -->
  <rect x="60" y="56" width="52" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
  <polyline points="68,86 78,86 82,72 88,100 92,86 104,86" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- title -->
  <text x="58" y="330" font-family="Poppins, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">EARTHQUAKE</text>
  <text x="58" y="395" font-family="Poppins, sans-serif" font-size="58" font-weight="700" fill="#f5a189" letter-spacing="1">DAMAGE PREDICTION</text>

  <!-- caption -->
  <text x="60" y="560" font-family="Raleway, sans-serif" font-size="18" fill="#f0d3c9">Machine Learning · Building Damage Grade</text>
  <line x1="60" y1="578" x2="1220" y2="578" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
</svg>
