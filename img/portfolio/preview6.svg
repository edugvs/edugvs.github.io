<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3f9"/>
      <stop offset="100%" stop-color="#dce8f5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg6)"/>

  <!-- connecting lines (hub and spoke) -->
  <g stroke="#a9c6e8" stroke-width="3">
    <line x1="400" y1="280" x2="220" y2="150"/>
    <line x1="400" y1="280" x2="580" y2="150"/>
    <line x1="400" y1="280" x2="180" y2="380"/>
    <line x1="400" y1="280" x2="400" y2="450"/>
    <line x1="400" y1="280" x2="620" y2="380"/>
  </g>

  <!-- satellite nodes -->
  <g font-family="Poppins, sans-serif" font-size="16" font-weight="600" fill="#45505b">
    <circle cx="220" cy="150" r="46" fill="#ffffff" stroke="#0563bb" stroke-width="3"/>
    <text x="220" y="145" text-anchor="middle">Data</text>
    <text x="220" y="164" text-anchor="middle">Owners</text>

    <circle cx="580" cy="150" r="46" fill="#ffffff" stroke="#0563bb" stroke-width="3"/>
    <text x="580" y="145" text-anchor="middle">Data</text>
    <text x="580" y="164" text-anchor="middle">Stewards</text>

    <circle cx="180" cy="380" r="46" fill="#ffffff" stroke="#0563bb" stroke-width="3"/>
    <text x="180" y="375" text-anchor="middle">Analytics</text>
    <text x="180" y="394" text-anchor="middle">Eng.</text>

    <circle cx="400" cy="450" r="46" fill="#ffffff" stroke="#0563bb" stroke-width="3"/>
    <text x="400" y="445" text-anchor="middle">Security &amp;</text>
    <text x="400" y="464" text-anchor="middle">Compliance</text>

    <circle cx="620" cy="380" r="46" fill="#ffffff" stroke="#0563bb" stroke-width="3"/>
    <text x="620" y="375" text-anchor="middle">Business</text>
    <text x="620" y="394" text-anchor="middle">Units</text>
  </g>

  <!-- central hub -->
  <circle cx="400" cy="280" r="72" fill="#0563bb"/>
  <text x="400" y="270" text-anchor="middle" font-family="Poppins, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Data</text>
  <text x="400" y="291" text-anchor="middle" font-family="Poppins, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Leadership</text>
  <text x="400" y="312" text-anchor="middle" font-family="Poppins, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Council</text>
</svg>
