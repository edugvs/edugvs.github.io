<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0a2e"/>
      <stop offset="100%" stop-color="#4a1f7a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#a56bf0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a56bf0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#cover3)"/>
  <rect width="1280" height="640" fill="url(#glow3)"/>

  <!-- radar / target rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <circle cx="1020" cy="220" r="40"/>
    <circle cx="1020" cy="220" r="80"/>
    <circle cx="1020" cy="220" r="120"/>
    <circle cx="1020" cy="220" r="160"/>
  </g>
  <circle cx="1020" cy="220" r="6" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="1080" cy="280" r="5" fill="#ffffff" fill-opacity="0.4"/>

  <!-- badge icon top-left: search/detection -->
  <rect x="60" y="56" width="52" height="52" rx="10" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="82" cy="82" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="91" y1="91" x2="102" y2="102" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- title -->
  <text x="58" y="330" font-family="Poppins, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">AD FRAUD</text>
  <text x="58" y="395" font-family="Poppins, sans-serif" font-size="58" font-weight="700" fill="#c49bf5" letter-spacing="1">DETECTION</text>

  <!-- caption -->
  <text x="60" y="560" font-family="Raleway, sans-serif" font-size="18" fill="#dccdef">Machine Learning · Mobile Ad Click Traffic</text>
  <line x1="60" y1="578" x2="1220" y2="578" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
</svg>
